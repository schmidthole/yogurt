stations:
- id: night-drive
  name: night drive
  prompt: Instrumental dramatic cinematic synthwave lo-fi soundscape. Expressive electronic textures, emotional
    melodies and a brooding nocturnal atmosphere.
  songs:
  - prompt: 'Instrumental dramatic synthwave lo-fi. Brooding neon-noir atmosphere, expressive
      analog synths, deep bass and worn tape texture. Spacious and emotionally charged,
      with an evolving melody and a cinematic sense of movement.'
    seconds: 180
  - prompt: 'Instrumental atmospheric synthwave lo-fi. Rain-soaked nocturnal mood, hazy
      electronics and intimate melancholy. Restrained but expressive, with room for
      unexpected harmonies, shifting textures and moments of stillness.'
    seconds: 210
  - prompt: 'Instrumental cinematic synthwave lo-fi. A desolate science-fiction landscape,
      gritty electronic textures and dramatic emotional contrasts. Haunting, immersive
      and bittersweet, with a distinctive melodic identity.'
    seconds: 180
  - prompt: 'Russian melodic street rap with minimalist instrumentation and emotional male
      vocals. Conversational rap flows into a heartfelt melodic hook. Understated bass
      and drums leave space for the voice and a memorable melodic accompaniment.
      Intimate, melancholic and nocturnal, with clear Russian diction and sincere delivery.'
    seconds: 180
    vocal_language: ru
    lyrics: |
      [Intro]

      [Verse 1]
      Последний трамвай растворился вдали,
      Мы столько друг другу сказать не смогли.
      В кармане записка, на сгибе потёрта,
      Твой почерк хранит то, что память не стёрла.
      На кухне у мамы не гаснет окно,
      Я редко звоню, но мне это дано:
      Вернуться без повода, сесть у порога,
      Сказать, что устал, что трудна мне дорога.
      Во дворе всё тот же качается клён,
      Только я стал тише, только двор не спит.
      Друг спросил: «Ты как?» — я ответил: «Нормально»,
      А потом мы молча простояли до зари.

      [Chorus]
      Оставь мне свет, я скоро буду дома,
      Сквозь мокрый снег узнаю этот двор.
      Мне тишина твоя давно знакома,
      Давай начнём неспешный разговор.
      Оставь мне свет, без громких обещаний,
      Я научусь не прятать боль в словах.
      Меж нами столько долгого молчанья,
      Но тёплый свет ещё в твоих окнах.

      [Verse 2]
      Я помню, как мы делили один билет,
      Смеялись, когда на ужин был только хлеб.
      Хотели уехать туда, где никто не знает,
      Как тесно бывает в квартире в начале мая.
      Теперь у меня есть ключи и пустой салон,
      Но я всё ловлю твой голос сквозь тихий фон.
      Не буду искать виноватых в чужих советах,
      Я слишком привык уходить, не давая ответа.
      И если однажды ты спросишь, зачем пришёл,
      Я просто скажу: «Без тебя мне нехорошо».
      Не стану клясться, что завтра всё станет легче,
      Но я остаюсь. Мне сегодня сказать больше нечего.

      [Chorus]
      Оставь мне свет, я скоро буду дома,
      Сквозь мокрый снег узнаю этот двор.
      Мне тишина твоя давно знакома,
      Давай начнём неспешный разговор.
      Оставь мне свет, без громких обещаний,
      Я научусь не прятать боль в словах.
      Меж нами столько долгого молчанья,
      Но тёплый свет ещё в твоих окнах.

      [Bridge]
      На лестнице тихо. Четыре утра.
      Я здесь. Если можно, открой мне сама.

      [Chorus]
      Оставь мне свет, я скоро буду дома,
      Сквозь мокрый снег узнаю этот двор.
      Мне тишина твоя давно знакома,
      Давай начнём неспешный разговор.

      [Outro]
  - prompt: 'Melodic progressive house with expressive female vocals. Clear luminous upper
      register, agile phrasing, intimate verses opening into an emotionally soaring hook.
      Warm rolling bass, steady four-on-the-floor groove, shimmering evolving synth motifs
      and spacious atmospheric harmonies. Bittersweet yet hopeful, hypnotic forward motion
      with gradual tension and release. The voice and instrumental melody answer each other;
      leave room for the groove to unfold. Warm, detailed production and clear vocals.'
    seconds: 210
    vocal_language: en
    lyrics: |
      [Intro]

      [Verse 1]
      The station clock has lost a minute
      Your coat is folded on my knees
      A waking town outside the window
      And all our words between the seats

      [Pre-Chorus]
      You touch the glass, the fields go by
      I catch your face against the sky

      [Chorus]
      We don't have to know where we're going
      Let the morning find us here
      Every mile, the distance opens
      You are near, you are near

      [Instrumental Break]

      [Verse 2]
      You draw a circle in the window
      Then watch it vanish in the heat
      I used to need a map for everything
      Now there's a ticket at my feet

      [Chorus]
      We don't have to know where we're going
      Let the morning find us here
      Every mile, the distance opens
      You are near, you are near

      [Bridge]
      For once I leave the question open
      Your hand is warm inside my own

      [Chorus]
      We don't have to know where we're going
      Let the morning find us here
      Every mile, the distance opens
      You are near, you are near

      [Outro]
